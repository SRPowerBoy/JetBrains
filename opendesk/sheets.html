<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDesk Sheets</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<script src="vendor/xlsx.full.min.js"></script>
<style>
  header.appbar { background: #2f855a; }
  .fbar { display: flex; gap: 8px; align-items: center; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .fbar #cellName { width: 56px; font-weight: 600; text-align: center; color: var(--muted); }
  .fbar input { flex: 1; font: 13px ui-monospace, Consolas, monospace; padding: 4px 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 4px; }
  .grid-wrap { flex: 1; overflow: auto; background: var(--panel); }
  table { border-collapse: collapse; table-layout: fixed; }
  th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 500; font-size: 12px; border: 1px solid var(--border); height: 22px; z-index: 1; }
  th.rh { position: sticky; left: 0; width: 44px; z-index: 2; }
  thead th.rh { z-index: 3; }
  td { border: 1px solid var(--border); padding: 0; width: 100px; height: 22px; }
  td input { width: 100%; height: 100%; border: 0; padding: 0 4px; font: 13px system-ui, sans-serif; background: transparent; color: var(--text); outline: none; }
  td input.num { text-align: right; }
  td input.err { color: #e53e3e; }
  td input.bold { font-weight: 700; }
  td.sel { outline: 2px solid #2f855a; outline-offset: -2px; }
  td.insel { background: rgba(47,133,90,.12); }
  td.fillprev { outline: 1px dashed #2f855a; outline-offset: -2px; }
  .grid-wrap { position: relative; }
  #fillHandle { position: absolute; width: 8px; height: 8px; background: #2f855a; border: 1px solid #fff; cursor: crosshair; z-index: 4; }
</style>
</head>
<body>
<header class="appbar">
  <a href="index.html">OpenDesk Sheets</a>
  <input class="title" id="title" value="Untitled spreadsheet" aria-label="Spreadsheet title">
</header>
<div class="toolbar">
  <button id="newBtn">New</button>
  <button id="openBtn" title="Open .xlsx, .xls, .ods or .csv">Open</button>
  <button id="xlsxBtn">Save .xlsx</button>
  <button id="csvBtn">Save .csv</button>
  <span class="sep"></span>
  <button id="boldBtn" title="Bold"><b>B</b></button>
  <button id="sumBtn" title="Insert SUM of the cells above">Σ AutoSum</button>
  <button id="clearBtn" title="Clear cell">Clear</button>
</div>
<div class="fbar"><span id="cellName">A1</span><span>ƒx</span><input id="formula" aria-label="Formula bar" spellcheck="false"></div>
<div class="grid-wrap"><table id="grid"></table><div id="fillHandle" title="Drag to fill · double-click to fill down"></div></div>
<div class="status" id="status"></div>

<script src="common.js"></script>
<script src="sheets-engine.js"></script>
<script src="sheets-fill.js"></script>
<script src="features.js"></script>
<script type="module">
await Store.ready; // storage loads asynchronously; everything below can use it synchronously
const ROWS = 100, COLS = 26;
const DOC = Docs.open('sheets', { title: 'Untitled spreadsheet', raw: {}, bold: {} });
const { computeAll, colName } = SheetEngine;
let raw = {}, bold = {}, sel = 'A1';
const grid = document.getElementById('grid');
const formula = document.getElementById('formula');
const titleEl = document.getElementById('title');
const inputs = {};

// Build grid.
let html = '<thead><tr><th class="rh"></th>';
for (let c = 0; c < COLS; c++) html += `<th>${colName(c)}</th>`;
html += '</tr></thead><tbody>';
for (let r = 1; r <= ROWS; r++) {
  html += `<tr><th class="rh">${r}</th>`;
  for (let c = 0; c < COLS; c++) html += `<td><input data-id="${colName(c)}${r}" aria-label="${colName(c)}${r}"></td>`;
  html += '</tr>';
}
grid.innerHTML = html + '</tbody>';
grid.querySelectorAll('input').forEach(i => inputs[i.dataset.id] = i);

function fmt(v) {
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(+v.toPrecision(10));
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  return v == null ? '' : String(v);
}

function render() {
  const values = computeAll(raw);
  for (const id in inputs) {
    const inp = inputs[id];
    if (document.activeElement === inp) continue;
    const v = values[id];
    inp.value = fmt(v);
    inp.className = (typeof v === 'number' ? 'num' : '') + (typeof v === 'string' && /^#[A-Z/0]+[!?]$/.test(v) ? ' err' : '') + (bold[id] ? ' bold' : '');
  }
}

let saveTimer;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 100);
}
function saveNow() { clearTimeout(saveTimer); if (DOC.id) Docs.save(DOC.id, { title: titleEl.value, raw, bold }); }
addEventListener('pagehide', saveNow);

function setCell(id, value) {
  if (value === '') delete raw[id]; else raw[id] = value;
  render(); persist();
}

// Selection: `sel` is the active (focused) cell; `rangeEnd` is the other corner of the range.
let rangeEnd = 'A1';
const { parseId, toId } = SheetFill;
function range() {
  const a = parseId(sel), b = parseId(rangeEnd);
  return { c1: Math.min(a.c, b.c), c2: Math.max(a.c, b.c), r1: Math.min(a.r, b.r), r2: Math.max(a.r, b.r) };
}
function cellsIn(rg) {
  const out = [];
  for (let r = rg.r1; r <= rg.r2; r++) for (let c = rg.c1; c <= rg.c2; c++) out.push(toId(c, r));
  return out;
}
const HELP = 'Drag or Shift+click to select · drag the corner square to fill a series · Ctrl+D fill down · Ctrl+K commands';
function paintSelection() {
  grid.querySelectorAll('td.insel').forEach(td => td.classList.remove('insel'));
  const rg = range(), cells = cellsIn(rg);
  if (cells.length > 1) cells.forEach(id => inputs[id].parentElement.classList.add('insel'));
  document.getElementById('cellName').textContent = cells.length > 1 ? `${toId(rg.c1, rg.r1)}:${toId(rg.c2, rg.r2)}` : sel;
  // Status bar: quick stats for multi-cell selections.
  const status = document.getElementById('status');
  if (cells.length > 1) {
    const values = computeAll(raw), nums = cells.map(id => values[id]).filter(v => typeof v === 'number');
    const sum = nums.reduce((a, b) => a + b, 0);
    status.textContent = nums.length ? `Sum: ${fmt(sum)} · Average: ${fmt(sum / nums.length)} · Count: ${nums.length} · Min: ${fmt(Math.min(...nums))} · Max: ${fmt(Math.max(...nums))}` : `${cells.length} cells selected`;
  } else status.textContent = HELP;
  const wrap = grid.parentElement, td = inputs[toId(rg.c2, rg.r2)].parentElement;
  const w = wrap.getBoundingClientRect(), t = td.getBoundingClientRect();
  Object.assign(document.getElementById('fillHandle').style, {
    left: (t.right - w.left + wrap.scrollLeft - 5) + 'px', top: (t.bottom - w.top + wrap.scrollTop - 5) + 'px',
  });
}

function select(id) {
  document.querySelector('td.sel')?.classList.remove('sel');
  sel = id; rangeEnd = id;
  inputs[id].parentElement.classList.add('sel');
  formula.value = raw[id] ?? '';
  paintSelection();
}
function extendTo(id) { rangeEnd = id; paintSelection(); }
function clampId(c, r) { return toId(Math.min(COLS - 1, Math.max(0, c)), Math.min(ROWS, Math.max(1, r))); }

// Apply many raw edits at once.
function setCells(updates) {
  for (const [id, v] of Object.entries(updates)) { if (v === '') delete raw[id]; else raw[id] = v; }
  render(); persist(); paintSelection();
  if (document.activeElement !== formula) formula.value = raw[sel] ?? '';
}

// Ctrl+D / Ctrl+R: copy the first row/column of the selection across it (or from the
// cell above/left when a single cell is selected), shifting relative references.
function copyFill(down) {
  let rg = range();
  if (rg.r1 === rg.r2 && rg.c1 === rg.c2) {
    if (down && rg.r1 > 1) rg = { ...rg, r1: rg.r1 - 1 };
    else if (!down && rg.c1 > 0) rg = { ...rg, c1: rg.c1 - 1 };
    else return;
  }
  const updates = {};
  for (const id of cellsIn(rg)) {
    const { c, r } = parseId(id);
    const srcId = down ? toId(c, rg.r1) : toId(rg.c1, r);
    if (srcId === id) continue;
    const v = raw[srcId] ?? '';
    updates[id] = v.startsWith('=') ? SheetFill.shiftFormula(v, down ? r - rg.r1 : 0, down ? 0 : c - rg.c1) : v;
  }
  setCells(updates);
}

// ---- fill handle ----
const handle = document.getElementById('fillHandle');
let fillDest = null;
function destFor(pointerId) {
  const src = range(), p = parseId(pointerId);
  const down = p.r - src.r2, up = src.r1 - p.r, right = p.c - src.c2, left = src.c1 - p.c;
  const best = Math.max(down, up, right, left);
  if (best <= 0) return null;
  if (best === down) return { ...src, r2: p.r };
  if (best === up) return { ...src, r1: p.r };
  if (best === right) return { ...src, c2: p.c };
  return { ...src, c1: p.c };
}
function previewFill(dest) {
  grid.querySelectorAll('td.fillprev').forEach(td => td.classList.remove('fillprev'));
  if (dest) cellsIn(dest).forEach(id => inputs[id].parentElement.classList.add('fillprev'));
}
function applyFill(dest) {
  const src = range();
  setCells(SheetFill.fill(raw, src, dest));
  // Select the whole filled block, keeping the active cell at the source corner.
  const anchor = toId(src.c1, src.r1);
  inputs[anchor].focus(); // focusin resets the range, so extend after
  extendTo(toId(dest.c1 === src.c1 ? dest.c2 : dest.c1, dest.r1 === src.r1 ? dest.r2 : dest.r1));
}
handle.addEventListener('mousedown', e => {
  e.preventDefault();
  document.activeElement?.blur?.(); // commit any edit in progress
  const onMove = ev => {
    const id = document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.('td')?.querySelector('input')?.dataset.id;
    if (id) { fillDest = destFor(id); previewFill(fillDest); }
  };
  const onUp = () => {
    removeEventListener('mousemove', onMove); removeEventListener('mouseup', onUp);
    previewFill(null);
    if (fillDest) applyFill(fillDest);
    fillDest = null;
  };
  addEventListener('mousemove', onMove); addEventListener('mouseup', onUp);
});
// Double-click: fill down as far as the neighbouring column has data.
handle.addEventListener('dblclick', () => {
  const src = range();
  for (const col of [src.c1 - 1, src.c2 + 1]) {
    if (col < 0 || col >= COLS) continue;
    let r = src.r2;
    while (r < ROWS && raw[toId(col, r + 1)] != null) r++;
    if (r > src.r2) { applyFill({ ...src, r2: r }); return; }
  }
});

// ---- clipboard: copy/cut/paste ranges (Excel, Google Sheets, web tables, other OpenDesk sheets) ----
const CLIP_TYPE = 'application/x-opendesk-cells'; // keeps formulas when pasting between OpenDesk sheets

function parseTSV(text) {
  const rows = [[]];
  let cell = '', i = 0, quoted = false;
  text = text.replace(/\r\n?/g, '\n').replace(/\n$/, '');
  while (i < text.length) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i += 2; continue; }
      if (ch === '"') { quoted = false; i++; continue; }
      cell += ch; i++; continue;
    }
    if (ch === '"' && cell === '') { quoted = true; i++; continue; }
    if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; }
    else if (ch === '\n') { rows[rows.length - 1].push(cell); rows.push([]); cell = ''; }
    else cell += ch;
    i++;
  }
  rows[rows.length - 1].push(cell);
  return rows;
}
function parseHTMLTable(html) {
  const table = new DOMParser().parseFromString(html, 'text/html').querySelector('table');
  return table ? [...table.rows].map(tr => [...tr.cells].map(td => td.textContent.replace(/\s+/g, ' ').trim())) : null;
}
// "1,234.5" -> "1234.5" so pasted numbers stay numbers; anything else is kept as typed.
const normalizeCell = v => (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v.trim()) ? v.trim().replace(/,/g, '') : v);

function copyRange(e) {
  const rg = range(), values = computeAll(raw);
  const rows = [], rawRows = [];
  for (let r = rg.r1; r <= rg.r2; r++) {
    const row = [], rawRow = [];
    for (let c = rg.c1; c <= rg.c2; c++) {
      const s = fmt(values[toId(c, r)]);
      row.push(/[\t\n"]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);
      rawRow.push(raw[toId(c, r)] ?? '');
    }
    rows.push(row.join('\t')); rawRows.push(rawRow);
  }
  e.clipboardData.setData('text/plain', rows.join('\n'));
  e.clipboardData.setData(CLIP_TYPE, JSON.stringify({ c: rg.c1, r: rg.r1, rows: rawRows }));
}

grid.addEventListener('copy', e => {
  if (cellsIn(range()).length < 2) return; // single cell: normal text copy from the input
  e.preventDefault(); copyRange(e);
});
grid.addEventListener('cut', e => {
  if (cellsIn(range()).length < 2) return;
  e.preventDefault(); copyRange(e); clearSelection();
});
grid.addEventListener('paste', e => {
  const cd = e.clipboardData;
  let rows = null, origin = null;
  try { const own = JSON.parse(cd.getData(CLIP_TYPE) || 'null'); if (own?.rows) { rows = own.rows; origin = own; } } catch { /* not ours */ }
  if (!rows && cd.getData('text/html')) rows = parseHTMLTable(cd.getData('text/html'));
  if (!rows) {
    const text = cd.getData('text/plain');
    if (!/[\t\n]/.test(text.replace(/\r?\n$/, ''))) return; // a single value: let the cell handle it
    rows = parseTSV(text);
  }
  e.preventDefault();
  const start = parseId(toId(range().c1, range().r1));
  const updates = {};
  let clipped = false;
  rows.forEach((row, dr) => row.forEach((v, dc) => {
    const c = start.c + dc, r = start.r + dr;
    if (c >= COLS || r > ROWS) { clipped = true; return; }
    let value = origin ? v : normalizeCell(v);
    if (origin && value.startsWith('=')) value = SheetFill.shiftFormula(value, start.r - origin.r, start.c - origin.c);
    updates[toId(c, r)] = value;
  }));
  document.activeElement?.blur?.();
  setCells(updates);
  const last = clampId(start.c + rows[0].length - 1, start.r + rows.length - 1);
  inputs[toId(start.c, start.r)].focus(); extendTo(last);
  if (clipped) alert('Some pasted cells were outside the grid (A1:Z100) and were left out.');
});

// Mouse range selection: drag across cells, or Shift+click.
let dragging = false;
grid.addEventListener('mousedown', e => {
  const id = e.target.dataset?.id; if (!id) return;
  if (e.shiftKey) { e.preventDefault(); extendTo(id); return; }
  if (id === sel) select(id); // plain click on the active cell collapses the range
  dragging = true;
});
grid.addEventListener('mouseover', e => {
  const id = e.target.dataset?.id;
  if (dragging && id && e.buttons === 1 && (id !== rangeEnd)) { extendTo(id); window.getSelection()?.removeAllRanges(); }
});
addEventListener('mouseup', () => { dragging = false; });
grid.parentElement.addEventListener('scroll', paintSelection);
addEventListener('resize', paintSelection);

function move(id, dr, dc) {
  const c = Math.min(COLS - 1, Math.max(0, id.charCodeAt(0) - 65 + dc));
  const r = Math.min(ROWS, Math.max(1, parseInt(id.slice(1), 10) + dr));
  inputs[colName(c) + r].focus();
}

grid.addEventListener('focusin', e => {
  const id = e.target.dataset.id; if (!id) return;
  if (id !== sel) select(id); // refocusing the active cell (e.g. after a dialog) keeps the range
  e.target.value = raw[id] ?? '';
  e.target.classList.remove('num', 'err');
  e.target.select(); // typing replaces the cell, like other spreadsheets
});
grid.addEventListener('focusout', e => {
  const id = e.target.dataset.id; if (!id) return;
  const value = e.target.value;
  if ((raw[id] ?? '') !== value) setCell(id, value);
  else render();
  // Re-render the blurred cell itself (render() skips the focused element).
  requestAnimationFrame(render);
});
grid.addEventListener('input', e => { if (e.target.dataset.id) formula.value = e.target.value; });
grid.addEventListener('keydown', e => {
  const id = e.target.dataset.id; if (!id) return;
  const atStart = e.target.selectionStart === 0 && e.target.selectionEnd === 0;
  const atEnd = e.target.selectionStart === e.target.value.length;
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  const multi = cellsIn(range()).length > 1;
  if (e.shiftKey && arrows[e.key]) {
    e.preventDefault();
    const end = parseId(rangeEnd), [dr, dc] = arrows[e.key];
    extendTo(clampId(end.c + dc, end.r + dr));
  }
  else if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'r')) { e.preventDefault(); e.target.blur(); copyFill(e.key === 'd'); inputs[id].focus(); }
  else if (multi && (e.key === 'Delete' || e.key === 'Backspace')) {
    e.preventDefault();
    setCells(Object.fromEntries(cellsIn(range()).map(c => [c, ''])));
    e.target.value = '';
  }
  else if (e.key === 'Enter') { e.preventDefault(); move(id, e.shiftKey ? -1 : 1, 0); }
  else if (e.key === 'Tab') { e.preventDefault(); move(id, 0, e.shiftKey ? -1 : 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(id, -1, 0); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); move(id, 1, 0); }
  else if (e.key === 'ArrowLeft' && atStart) { e.preventDefault(); move(id, 0, -1); }
  else if (e.key === 'ArrowRight' && atEnd) { e.preventDefault(); move(id, 0, 1); }
  else if (e.key === 'Escape') { e.target.value = raw[id] ?? ''; e.target.blur(); }
});

formula.addEventListener('input', () => { inputs[sel].value = formula.value; });
formula.addEventListener('keydown', e => {
  if (e.key === 'Enter') { setCell(sel, formula.value); move(sel, 1, 0); }
});
formula.addEventListener('change', () => setCell(sel, formula.value));
titleEl.addEventListener('input', persist);

document.getElementById('newBtn').onclick = () => { location.href = 'sheets.html?new'; };
function toggleBold() {
  const on = !bold[sel];
  for (const id of cellsIn(range())) { if (on) bold[id] = true; else delete bold[id]; }
  render(); persist();
}
function clearSelection() {
  setCells(Object.fromEntries(cellsIn(range()).map(c => [c, ''])));
  formula.value = '';
}
document.getElementById('boldBtn').onclick = toggleBold;
document.getElementById('clearBtn').onclick = clearSelection;
document.getElementById('sumBtn').onclick = () => {
  const col = sel[0], row = parseInt(sel.slice(1), 10);
  let top = row - 1;
  while (top > 1 && raw[col + (top - 1)] != null) top--;
  if (row > 1) { setCell(sel, `=SUM(${col}${top}:${col}${row - 1})`); select(sel); }
};

document.getElementById('openBtn').onclick = async () => {
  const file = await pickFile('.xlsx,.xls,.ods,.csv');
  if (!file) return;
  if (!window.XLSX) return alert('The spreadsheet importer failed to load (are you offline?).');
  const wb = XLSX.read(await file.arrayBuffer());
  const ws = wb.Sheets[wb.SheetNames[0]];
  const imported = {};
  for (const addr in ws) {
    if (addr[0] === '!') continue;
    const m = /^([A-Z])(\d+)$/.exec(addr);
    if (!m || parseInt(m[2], 10) > ROWS) continue; // outside our A1:Z100 grid
    const cell = ws[addr];
    imported[addr] = cell.f ? '=' + cell.f : String(cell.v ?? '');
  }
  if (wb.SheetNames.length > 1) alert(`Opened the first sheet ("${wb.SheetNames[0]}") only — multiple sheets aren't supported yet.`);
  // Opened files become a new spreadsheet; the current one is left untouched.
  const id = Docs.create('sheets', { title: file.name.replace(/\.[^.]+$/, ''), raw: imported, bold: {} });
  if (id) go(Docs.url('sheets', id));
};

function buildSheet() {
  const values = computeAll(raw);
  const ws = {};
  let maxR = 0, maxC = 0;
  for (const id in raw) {
    const c = id.charCodeAt(0) - 65, r = parseInt(id.slice(1), 10) - 1;
    maxR = Math.max(maxR, r); maxC = Math.max(maxC, c);
    const v = values[id];
    const cell = typeof v === 'number' ? { t: 'n', v } : typeof v === 'boolean' ? { t: 'b', v } : { t: 's', v: String(v) };
    if (raw[id][0] === '=') cell.f = raw[id].slice(1);
    ws[id] = cell;
  }
  ws['!ref'] = `A1:${colName(maxC)}${maxR + 1}`;
  return ws;
}
document.getElementById('xlsxBtn').onclick = () => {
  if (!window.XLSX) return alert('The spreadsheet exporter failed to load (are you offline?).');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildSheet(), 'Sheet1');
  XLSX.writeFile(wb, safeName(titleEl.value, 'spreadsheet') + '.xlsx');
};
document.getElementById('csvBtn').onclick = () => {
  const values = computeAll(raw);
  let maxR = 0, maxC = 0;
  for (const id in raw) { maxR = Math.max(maxR, parseInt(id.slice(1), 10)); maxC = Math.max(maxC, id.charCodeAt(0) - 64); }
  const lines = [];
  for (let r = 1; r <= maxR; r++) {
    const row = [];
    for (let c = 0; c < maxC; c++) {
      const s = fmt(values[colName(c) + r]);
      row.push(/[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);
    }
    lines.push(row.join(','));
  }
  download(safeName(titleEl.value, 'spreadsheet') + '.csv', lines.join('\n'), 'text/csv');
};

const validRaw = obj => Object.fromEntries(Object.entries(obj || {})
  .filter(([k, v]) => /^[A-Z]\d{1,3}$/.test(k) && typeof v === 'string'));
raw = validRaw(DOC.state.raw); bold = DOC.state.bold || {};
titleEl.value = String(DOC.state.title || 'Untitled spreadsheet');
render(); select('A1');
function goToCell() {
  const id = (prompt('Go to cell (e.g. B12):') || '').toUpperCase().trim();
  if (/^[A-Z]([1-9]\d?|100)$/.test(id)) { inputs[id].focus(); inputs[id].scrollIntoView({ block: 'center', inline: 'center' }); }
}
function startFormula(fn) {
  const rg = range(), multi = cellsIn(rg).length > 1;
  // With a range selected, put the function in the cell below it; otherwise start typing it.
  if (multi && rg.c1 === rg.c2 && rg.r2 < ROWS) {
    const target = toId(rg.c1, rg.r2 + 1);
    setCells({ [target]: `=${fn}(${toId(rg.c1, rg.r1)}:${toId(rg.c2, rg.r2)})` });
    inputs[target].focus();
  } else { const inp = inputs[sel]; inp.focus(); inp.value = `=${fn}(`; formula.value = inp.value; }
}
// Find & replace over cell contents (what you typed, including formulas), row by row.
const escRe = q => q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const sheetFind = {
  find(q, matchCase) {
    const needle = matchCase ? q : q.toLowerCase();
    return Object.keys(raw)
      .filter(id => (matchCase ? raw[id] : raw[id].toLowerCase()).includes(needle))
      .sort((a, b) => (+a.slice(1) - +b.slice(1)) || a.localeCompare(b))
      .map(id => ({ id, q, matchCase }));
  },
  show(m) { select(m.id); inputs[m.id].parentElement.scrollIntoView({ block: 'nearest', inline: 'nearest' }); },
  replace(m, text) {
    const re = new RegExp(escRe(m.q), m.matchCase ? 'g' : 'gi');
    setCells({ [m.id]: raw[m.id].replace(re, () => text) });
    select(m.id);
  },
  replaceAll(q, text, matchCase) {
    const all = this.find(q, matchCase), re = new RegExp(escRe(q), matchCase ? 'g' : 'gi');
    setCells(Object.fromEntries(all.map(m => [m.id, raw[m.id].replace(re, () => text)])));
    return all.length;
  },
};

const cmd = (name, run, hint, keywords) => ({ name, run, hint, keywords });
const sheetCommands = () => [
  cmd('Bold', toggleBold, '', 'strong'),
  cmd('AutoSum', () => document.getElementById('sumBtn').click(), '', 'total sum'),
  cmd('Clear selected cells', clearSelection, 'Delete', 'erase empty'),
  cmd('Fill down', () => copyFill(true), 'Ctrl+D', 'copy'),
  cmd('Fill right', () => copyFill(false), 'Ctrl+R', 'copy'),
  cmd('Go to cell…', goToCell, '', 'jump navigate'),
  ...['SUM', 'AVERAGE', 'MIN', 'MAX', 'COUNT', 'ROUND', 'IF', 'CONCAT'].map(fn => cmd(`Insert ${fn}()`, () => startFormula(fn), 'formula', 'function')),
  cmd('Open file from computer', () => document.getElementById('openBtn').click(), '', 'import xlsx csv'),
  cmd('Save as Excel (.xlsx)', () => document.getElementById('xlsxBtn').click(), '', 'download export'),
  cmd('Save as CSV', () => document.getElementById('csvBtn').click(), '', 'download export'),
];

// Read-only console/test access to module state.
Object.defineProperties(window, { raw: { get: () => raw }, sel: { get: () => sel } });

OpenDesk.setup({
  app: 'sheets',
  commands: sheetCommands,
  find: sheetFind,
  overrideFind: true, // the browser's Ctrl+F can't search inside cell inputs
  key: DOC.key,
  id: DOC.id,
  isEmpty: () => !Object.keys(raw).length,
  getState: () => ({ title: titleEl.value, raw, bold }),
  setState: st => {
    raw = validRaw(st.raw); bold = {};
    for (const k in st.bold || {}) if (k in raw) bold[k] = true;
    titleEl.value = String(st.title || 'Untitled spreadsheet');
    persist();
    render(); select('A1');
  },
  toText: st => (st.title || '') + '\n\n' + Object.keys(st.raw || {})
    .sort((a, b) => (+a.slice(1) - +b.slice(1)) || a.localeCompare(b))
    .map(k => `${k}: ${st.raw[k]}`).join('\n'),
});
</script>
