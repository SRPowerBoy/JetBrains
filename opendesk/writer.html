<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDesk Writer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<script src="vendor/mammoth.browser.min.js"></script>
<style>
  .scroll { flex: 1; overflow: auto; padding: 24px 16px; }
  #page {
    background: var(--page); color: #111; max-width: 816px; min-height: 1056px; margin: 0 auto;
    padding: 72px 72px; box-shadow: 0 1px 4px rgba(0,0,0,.25); outline: none;
    font: 12pt/1.5 Calibri, Carlito, "Segoe UI", sans-serif;
  }
  #page table { border-collapse: collapse; width: 100%; }
  #page td, #page th { border: 1px solid #999; padding: 4px 6px; min-width: 40px; }
  #page img { max-width: 100%; }
  @media (max-width: 600px) { #page { padding: 24px 16px; min-height: 60vh; } }
  #page .live-range { margin: 8px 0; padding: 6px; border: 1px dashed #9cc7b0; border-radius: 4px; cursor: default; }
  @media print {
    #page .live-range { border: 0; padding: 0; } .live-tag { display: none; }
    header, .toolbar, .status { display: none !important; }
    .scroll { padding: 0; overflow: visible; }
    #page { box-shadow: none; padding: 0; max-width: none; min-height: 0; }
  }
</style>
</head>
<body>
<header class="appbar">
  <a href="index.html">OpenDesk Writer</a>
  <input class="title" id="title" value="Untitled document" aria-label="Document title">
</header>
<div class="toolbar">
  <button data-act="new" title="New">New</button>
  <button data-act="open" title="Open .docx, .html or .txt">Open</button>
  <select id="saveAs" aria-label="Save as">
    <option value="">Save as…</option>
    <option value="doc">Word (.doc)</option>
    <option value="html">Web page (.html)</option>
    <option value="txt">Plain text (.txt)</option>
    <option value="pdf">PDF (print)</option>
  </select>
  <span class="sep"></span>
  <button data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
  <button data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <select id="block" aria-label="Paragraph style">
    <option value="P">Normal</option><option value="H1">Heading 1</option>
    <option value="H2">Heading 2</option><option value="H3">Heading 3</option>
    <option value="BLOCKQUOTE">Quote</option><option value="PRE">Code</option>
  </select>
  <select id="font" aria-label="Font">
    <option>Calibri</option><option>Arial</option><option>Georgia</option>
    <option>Times New Roman</option><option>Courier New</option><option>Verdana</option>
  </select>
  <select id="size" aria-label="Font size">
    <option value="1">8</option><option value="2">10</option><option value="3" selected>12</option>
    <option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option>
  </select>
  <span class="sep"></span>
  <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
  <input type="color" id="color" title="Text color" value="#000000">
  <input type="color" id="highlight" title="Highlight" value="#ffff00">
  <span class="sep"></span>
  <button data-cmd="justifyLeft" title="Align left">⯇</button>
  <button data-cmd="justifyCenter" title="Center">≡</button>
  <button data-cmd="justifyRight" title="Align right">⯈</button>
  <button data-cmd="insertUnorderedList" title="Bullets">• List</button>
  <button data-cmd="insertOrderedList" title="Numbering">1. List</button>
  <span class="sep"></span>
  <button data-act="link" title="Insert link">Link</button>
  <button data-act="image" title="Insert image">Image</button>
  <button data-act="table" title="Insert table">Table</button>
  <button data-act="pagebreak" title="Page break">Break</button>
  <button data-act="liveData" title="Insert a table or chart that stays in sync with your spreadsheet">⇄ Sheet data</button>
  <button data-act="toSlides" title="Turn this document into a presentation: headings become slides">→ Slides</button>
</div>
<div class="scroll"><div id="page" contenteditable="true" spellcheck="true"><p><br></p></div></div>
<div class="status" id="status">0 words</div>

<script src="common.js"></script>
<script src="sheets-engine.js"></script>
<script src="features.js"></script>
<script>
const page = document.getElementById('page');
const titleEl = document.getElementById('title');
const BLANK = { title: 'Untitled document', html: '' };
const DOC = Docs.open('writer', BLANK);

function exec(cmd, val) {
  page.focus();
  // Pass no value at all when there is none: some commands use it as an attribute (e.g. <hr id="null">).
  if (val === undefined) document.execCommand(cmd); else document.execCommand(cmd, false, val);
  save();
}

function updateStatus() {
  const words = (page.innerText.match(/\S+/g) || []).length;
  document.getElementById('status').textContent = `${words} words · ${page.innerText.length} characters · autosaved locally`;
}
let saveTimer;
function save() {
  updateStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (DOC.id) Docs.save(DOC.id, { title: titleEl.value, html: page.innerHTML }); }, 400);
}

// Stored HTML may come from a share link or an old version, so always sanitize it.
function load(title, html) {
  titleEl.value = title; page.innerHTML = sanitizeHTML(html || '') || '<p><br></p>'; updateStatus();
}
document.title = (DOC.state.title || 'Untitled') + ' – OpenDesk Writer';
load(String(DOC.state.title || BLANK.title), DOC.state.html);

function openAsNewFile(title, html) {
  const id = Docs.create('writer', { title, html: sanitizeHTML(html) });
  if (id) location.href = Docs.url('writer', id);
}

page.addEventListener('input', save);
titleEl.addEventListener('input', save);
document.execCommand('styleWithCSS', false, true);

document.querySelectorAll('[data-cmd]').forEach(b =>
  b.addEventListener('click', () => exec(b.dataset.cmd)));
document.getElementById('block').onchange = e => exec('formatBlock', e.target.value);
document.getElementById('font').onchange = e => exec('fontName', e.target.value);
document.getElementById('size').onchange = e => exec('fontSize', e.target.value);
document.getElementById('color').oninput = e => exec('foreColor', e.target.value);
document.getElementById('highlight').oninput = e => exec('hiliteColor', e.target.value);

function wrapDoc(body) {
  const t = titleEl.value.replace(/</g, '&lt;');
  return `<!doctype html><html><head><meta charset="utf-8"><title>${t}</title>
<style>body{font:12pt/1.5 Calibri,sans-serif;max-width:816px;margin:auto}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 6px}</style>
</head><body>${body}</body></html>`;
}

const actions = {
  new() { location.href = 'writer.html?new'; },
  async open() {
    const file = await pickFile('.docx,.html,.htm,.txt,.md');
    if (!file) return;
    const name = file.name.replace(/\.[^.]+$/, '');
    if (/\.docx$/i.test(file.name)) {
      if (!window.mammoth) return alert('The .docx importer failed to load (are you offline?).');
      const result = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
      openAsNewFile(name, result.value);
    } else if (/\.html?$/i.test(file.name)) {
      openAsNewFile(name, await file.text());
    } else {
      const div = document.createElement('div');
      openAsNewFile(name, (await file.text()).split(/\n/).map(line => { div.textContent = line; return `<p>${div.innerHTML || '<br>'}</p>`; }).join(''));
    }
  },
  link() {
    const url = prompt('Link URL:', 'https://');
    if (url && /^(https?:|mailto:)/i.test(url)) exec('createLink', url);
  },
  async image() {
    const file = await pickFile('image/*');
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => exec('insertImage', reader.result);
    reader.readAsDataURL(file);
  },
  table() {
    const rows = +prompt('Rows:', '3') || 0, cols = +prompt('Columns:', '3') || 0;
    if (rows < 1 || cols < 1 || rows > 100 || cols > 20) return;
    const row = '<tr>' + '<td><br></td>'.repeat(cols) + '</tr>';
    exec('insertHTML', `<table>${row.repeat(rows)}</table><p><br></p>`);
  },
  async liveData() {
    const sel = getSelection();
    const saved = sel.rangeCount && page.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
    const choice = await OpenDesk.askRange();
    if (!choice) return;
    page.focus();
    if (saved) { sel.removeAllRanges(); sel.addRange(saved); }
    exec('insertHTML', `<div class="live-range" contenteditable="false" data-range="${choice.range}" data-mode="${choice.mode}" data-sheet="${choice.sheet}">${OpenDesk.renderLive(choice.range, choice.mode, choice.sheet)}</div><p><br></p>`);
  },
  toSlides() {
    // Always a new presentation file, so no existing deck is replaced.
    const id = Docs.create('slides', { title: titleEl.value, deck: docToDeck() });
    if (id) location.href = Docs.url('slides', id);
  },
  pagebreak() { exec('insertHTML', '<hr style="page-break-after:always;border:0;border-top:1px dashed #bbb"><p><br></p>'); },
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => actions[b.dataset.act]()));

document.getElementById('saveAs').onchange = e => { const fmt = e.target.value; e.target.value = ''; saveAs(fmt); };
function saveAs(fmt) {
  const name = safeName(titleEl.value, 'document');
  if (fmt === 'doc') {
    // Word opens HTML saved with the msword MIME type and preserves formatting.
    download(name + '.doc', '﻿' + wrapDoc(page.innerHTML), 'application/msword');
  } else if (fmt === 'html') download(name + '.html', wrapDoc(page.innerHTML), 'text/html');
  else if (fmt === 'txt') download(name + '.txt', page.innerText, 'text/plain');
  else if (fmt === 'pdf') window.print();
}

// ---- Markdown shortcuts ----
// At the start of a paragraph: "# " "## " "### " headings, "- " or "* " bullets, "1. " numbering,
// "> " quote, "```" + space code block, "---" + Enter divider.
// Inline, when the closing marker is typed: **bold**, *italic* or _italic_, ~~strike~~.
const BLOCK_RULES = [
  [/^###$/, () => exec('formatBlock', 'H3')],
  [/^##$/, () => exec('formatBlock', 'H2')],
  [/^#$/, () => exec('formatBlock', 'H1')],
  [/^[-*]$/, () => exec('insertUnorderedList')],
  [/^1[.)]$/, () => exec('insertOrderedList')],
  [/^>$/, () => exec('formatBlock', 'BLOCKQUOTE')],
  [/^```$/, () => exec('formatBlock', 'PRE')],
];
const INLINE_RULES = [
  [/\*\*([^*\s](?:[^*]*[^*\s])?)\*\*$/, 'bold'],
  [/(?:^|[^*\w])\*([^*\s](?:[^*]*[^*\s])?)\*$/, 'italic'],
  [/(?:^|[^_\w])_([^_\s](?:[^_]*[^_\s])?)_$/, 'italic'],
  [/~~([^~\s](?:[^~]*[^~\s])?)~~$/, 'strikeThrough'],
];
const TAG = { bold: 'b', italic: 'i', strikeThrough: 's' };

function currentBlock() {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed || !page.contains(sel.anchorNode)) return null;
  let n = sel.anchorNode;
  while (n && n !== page && !(n.nodeType === 1 && /^(P|DIV|H[1-6]|LI|BLOCKQUOTE|PRE)$/.test(n.tagName))) n = n.parentNode;
  return n && n !== page ? n : null;
}
function textBeforeCaret(block) {
  const r = getSelection().getRangeAt(0).cloneRange();
  r.setStart(block, 0);
  return r.toString();
}
function deleteBack(chars) {
  const sel = getSelection();
  for (let i = 0; i < chars; i++) sel.modify('extend', 'backward', 'character');
  document.execCommand('delete');
}

page.addEventListener('input', e => {
  if (e.inputType !== 'insertText' || !e.data) return;
  const block = currentBlock();
  if (!block) return;
  const before = textBeforeCaret(block).replace(/ /g, ' ');

  if (e.data === ' ' && /^(P|DIV)$/.test(block.tagName)) {
    const marker = before.slice(0, -1);
    const rule = BLOCK_RULES.find(([re]) => re.test(marker));
    if (rule && before.length === marker.length + 1) { deleteBack(before.length); rule[1](); return; }
  }

  for (const [re, cmd] of INLINE_RULES) {
    const m = re.exec(before);
    if (!m) continue;
    const full = m[0].replace(/^[^*_~]/, ''); // drop the boundary character the regex consumed
    deleteBack(full.length);
    const div = document.createElement('div'); div.textContent = m[1];
    exec('insertHTML', `<${TAG[cmd]}>${div.innerHTML}</${TAG[cmd]}>`);
    if (document.queryCommandState(cmd)) document.execCommand(cmd); // stop formatting what's typed next
    return;
  }
});

page.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey) return;
  const block = currentBlock();
  // Enter on an empty quote/code line returns to normal text (browsers otherwise stay in it).
  if (block && /^(BLOCKQUOTE|PRE)$/.test(block.tagName) && !block.textContent.trim()) {
    e.preventDefault();
    exec('formatBlock', 'P');
    return;
  }
  if (block && /^(P|DIV)$/.test(block.tagName) && block.textContent.trim() === '---') {
    e.preventDefault();
    deleteBack(textBeforeCaret(block).length);
    exec('insertHorizontalRule');
  }
});

// ---- live spreadsheet blocks ----
function refreshLive() {
  const before = page.innerHTML;
  page.querySelectorAll('.live-range').forEach(el => {
    el.contentEditable = 'false';
    // Linked sheet not on this device (shared doc): keep the last rendered values.
    if (el.dataset.sheet && !Docs.meta(el.dataset.sheet)) return;
    el.innerHTML = OpenDesk.renderLive(el.dataset.range, el.dataset.mode, el.dataset.sheet);
  });
  if (page.innerHTML !== before) save();
}
OpenDesk.onSheetChange(refreshLive);

// ---- Document -> Slides: each heading starts a slide, paragraphs/list items become bullets ----
function docToDeck() {
  const id = () => Math.random().toString(36).slice(2, 10);
  const sections = [];
  let cur = null;
  const start = title => { cur = { title, bullets: [], live: [] }; sections.push(cur); };
  const addBullet = text => {
    text = text.replace(/\s+/g, ' ').trim();
    if (!text) return;
    if (!cur) start(titleEl.value);
    cur.bullets.push(text.length > 160 ? text.slice(0, 157) + '…' : text);
  };
  for (const node of page.children) {
    if (/^H[1-3]$/.test(node.tagName)) start(node.innerText.trim() || 'Untitled');
    else if (node.classList.contains('live-range')) { if (!cur) start(titleEl.value); cur.live.push({ range: node.dataset.range, mode: node.dataset.mode, sheet: node.dataset.sheet }); }
    else if (node.tagName === 'UL' || node.tagName === 'OL') node.querySelectorAll('li').forEach(li => addBullet(li.innerText));
    else if (node.tagName !== 'TABLE' && node.tagName !== 'HR') addBullet(node.innerText);
  }
  const text = (t, x, y, w, h, size, bold, color) => ({ id: id(), type: 'text', x, y, w, h, text: t, size, color, bold });
  const slides = [{ bg: '#ffffff', items: [
    text(titleEl.value, 80, 180, 800, 100, 44, true, '#222222'),
    text(new Date().toLocaleDateString(), 80, 300, 800, 50, 22, false, '#666666'),
  ]}];
  const PER_SLIDE = 6;
  for (const s of sections) {
    const chunks = [];
    for (let i = 0; i < s.bullets.length; i += PER_SLIDE) chunks.push(s.bullets.slice(i, i + PER_SLIDE));
    if (!chunks.length && !s.live.length) chunks.push([]);
    chunks.forEach((chunk, i) => slides.push({ bg: '#ffffff', items: [
      text(s.title + (i ? ' (cont.)' : ''), 60, 40, 840, 80, 36, true, '#222222'),
      ...(chunk.length ? [text(chunk.map(b => '• ' + b).join('\n'), 60, 140, 840, 360, 22, false, '#333333')] : []),
    ]}));
    for (const l of s.live) slides.push({ bg: '#ffffff', items: [
      text(s.title, 60, 40, 840, 80, 36, true, '#222222'),
      { id: id(), type: 'live', range: l.range, mode: l.mode, sheet: l.sheet, x: 120, y: 140, w: 720, h: 360 },
    ]});
  }
  return { slides };
}

// Find & replace over the page's text (live spreadsheet blocks are skipped; matches don't span formatting changes).
const hasHighlights = !!(window.Highlight && CSS.highlights);
const writerFind = {
  find(q, matchCase) {
    const out = [], needle = matchCase ? q : q.toLowerCase();
    const walker = document.createTreeWalker(page, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement.closest('.live-range') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    for (let n; (n = walker.nextNode());) {
      const hay = matchCase ? n.data : n.data.toLowerCase();
      for (let i = hay.indexOf(needle); needle && i >= 0; i = hay.indexOf(needle, i + needle.length)) {
        const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length); out.push(r);
      }
    }
    if (hasHighlights) CSS.highlights.set('find-all', new Highlight(...out));
    return out;
  },
  show(r) {
    if (hasHighlights) CSS.highlights.set('find-current', new Highlight(r));
    r.startContainer.parentElement.scrollIntoView({ block: 'center' });
  },
  replace(r, text) {
    const sel = getSelection();
    page.focus(); sel.removeAllRanges(); sel.addRange(r);
    if (text) document.execCommand('insertText', false, text); else document.execCommand('delete');
    save();
  },
  replaceAll(q, text, matchCase) {
    const all = this.find(q, matchCase);
    for (const r of all.reverse()) this.replace(r, text); // back to front keeps earlier offsets valid
    return all.length;
  },
  close() { if (hasHighlights) { CSS.highlights.delete('find-all'); CSS.highlights.delete('find-current'); } },
};

const cmd = (name, run, hint, keywords) => ({ name, run, hint, keywords });
const writerCommands = () => [
  cmd('Bold', () => exec('bold'), 'Ctrl+B', 'strong **'),
  cmd('Italic', () => exec('italic'), 'Ctrl+I', 'emphasis *'),
  cmd('Underline', () => exec('underline'), 'Ctrl+U'),
  cmd('Strikethrough', () => exec('strikeThrough'), '~~', 'cross out'),
  cmd('Heading 1', () => exec('formatBlock', 'H1'), '# ', 'title h1'),
  cmd('Heading 2', () => exec('formatBlock', 'H2'), '## ', 'h2 subtitle'),
  cmd('Heading 3', () => exec('formatBlock', 'H3'), '### ', 'h3'),
  cmd('Normal text', () => exec('formatBlock', 'P'), '', 'paragraph body'),
  cmd('Quote', () => exec('formatBlock', 'BLOCKQUOTE'), '> ', 'blockquote'),
  cmd('Code block', () => exec('formatBlock', 'PRE'), '``` ', 'monospace'),
  cmd('Bulleted list', () => exec('insertUnorderedList'), '- ', 'bullets ul'),
  cmd('Numbered list', () => exec('insertOrderedList'), '1. ', 'ol numbering'),
  cmd('Align left', () => exec('justifyLeft')),
  cmd('Align center', () => exec('justifyCenter'), '', 'centre middle'),
  cmd('Align right', () => exec('justifyRight')),
  cmd('Clear formatting', () => exec('removeFormat'), '', 'plain reset'),
  cmd('Insert link', actions.link, '', 'url hyperlink'),
  cmd('Insert image', actions.image, '', 'picture photo'),
  cmd('Insert table', actions.table, '', 'grid'),
  cmd('Insert divider', () => exec('insertHorizontalRule'), '---', 'horizontal rule hr line'),
  cmd('Insert page break', actions.pagebreak),
  cmd('Insert live spreadsheet data', actions.liveData, '', 'chart table sheets'),
  cmd('Convert document to slides', actions.toSlides, '', 'presentation deck'),
  cmd('Open file from computer', actions.open, '', 'import docx'),
  cmd('Save as Word (.doc)', () => saveAs('doc'), 'Ctrl+S', 'download export'),
  cmd('Save as web page (.html)', () => saveAs('html'), '', 'download export'),
  cmd('Save as plain text (.txt)', () => saveAs('txt'), '', 'download export'),
  cmd('Print / Save as PDF', () => saveAs('pdf'), '', 'export'),
  cmd('Undo', () => exec('undo'), 'Ctrl+Z'),
  cmd('Redo', () => exec('redo'), 'Ctrl+Y'),
];

OpenDesk.setup({
  app: 'writer',
  commands: writerCommands,
  find: writerFind,
  key: DOC.key,
  id: DOC.id,
  isEmpty: () => !page.innerText.trim() && !page.querySelector('img,table,.live-range'),
  getState: () => ({ title: titleEl.value, html: page.innerHTML }),
  setState: st => { load(String(st.title || 'Untitled document'), st.html); save(); refreshLive(); },
  toText: st => { const d = new DOMParser().parseFromString(sanitizeHTML(st.html || ''), 'text/html'); d.querySelectorAll('.live-range').forEach(n => n.textContent = `[live ${n.dataset.range}]`); d.querySelectorAll('p,div,h1,h2,h3,li,tr,br').forEach(n => n.append('\n')); return ((st.title || '') + '\n\n' + d.body.textContent).replace(/\n{3,}/g, '\n\n'); },
});
refreshLive();

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    download(safeName(titleEl.value, 'document') + '.doc', '﻿' + wrapDoc(page.innerHTML), 'application/msword');
  }
});
</script>
</body>
</html>
